<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="850" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Cyber Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; }
      .code { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; r: 5; }
        50% { opacity: 1; r: 7; }
      }
      @keyframes scan {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(850px); }
      }
      .beacon { animation: pulse 2.5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="850" height="240" rx="16" fill="url(#bgGradient)"/>
  <rect width="850" height="240" rx="16" fill="url(#grid)"/>
  <rect width="848" height="238" x="1" y="1" rx="15" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Top System Bar -->
  <g transform="translate(35, 36)">
    <circle cx="0" cy="0" r="5" fill="#10b981" class="beacon"/>
    <circle cx="0" cy="0" r="3" fill="#34d399"/>
    <text x="14" y="4" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1.5" class="code">SYSTEM OPERATIONAL // ARCHITECT RUNTIME ACTIVE</text>
    
    <text x="770" y="4" text-anchor="end" fill="#64748b" font-size="11" letter-spacing="1.2" class="code">EST. 2022 // BLR-IND</text>
  </g>

  <!-- Main Identity Header -->
  <g transform="translate(35, 115)">
    <!-- OMI Title with Glow -->
    <text x="0" y="0" fill="url(#textGradient)" font-size="52" font-weight="900" letter-spacing="3" class="mono" filter="url(#glow)">OMI</text>
    <text x="0" y="0" fill="url(#textGradient)" font-size="52" font-weight="900" letter-spacing="3" class="mono">OMI</text>
    
    <!-- Secondary Badge -->
    <rect x="125" y="-38" width="85" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="167" y="-22" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="700" letter-spacing="1" class="code">v2026.11</text>
    
    <!-- Subtitle -->
    <text x="2" y="32" fill="#94a3b8" font-size="15" font-weight="500" letter-spacing="0.5" class="mono">
      FULL-STACK &amp; AGENTIC SYSTEMS ARCHITECT
    </text>
  </g>

  <!-- Accent Divider Line -->
  <line x1="35" y1="172" x2="815" y2="172" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <!-- Bottom Core Pillars -->
  <g transform="translate(35, 206)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="-4" r="3" fill="#00f2fe"/>
      <text x="14" y="0" fill="#cbd5e1" font-size="12" font-weight="600" class="code">01. Autonomous Agents &amp; MCP</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(260, 0)">
      <circle cx="4" cy="-4" r="3" fill="#a855f7"/>
      <text x="14" y="0" fill="#cbd5e1" font-size="12" font-weight="600" class="code">02. Serverless Frontier LLMs</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(530, 0)">
      <circle cx="4" cy="-4" r="3" fill="#10b981"/>
      <text x="14" y="0" fill="#cbd5e1" font-size="12" font-weight="600" class="code">03. Indian SME Fintech Rails</text>
    </g>
  </g>
</svg>
