<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="proBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Accent Title Gradient -->
    <linearGradient id="proTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Subtle Blue Accent Line -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="180" rx="10" fill="url(#proBg)"/>
  <rect width="848" height="178" x="1" y="1" rx="9" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Left Accent Vertical Bar -->
  <rect x="0" y="24" width="4" height="132" rx="2" fill="url(#accentLine)"/>

  <!-- Top Status Badge -->
  <g transform="translate(42, 38)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
    <text x="12" y="3.5" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1" class="mono">SYSTEMS &amp; AGENTIC AI ARCHITECTURE</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(42, 85)">
    <text x="0" y="0" fill="url(#proTitleGrad)" font-size="34" letter-spacing="-0.5" class="title">Omi</text>
    <text x="75" y="-3" fill="#64748b" font-size="20" font-weight="300" class="title">/</text>
    <text x="92" y="-2" fill="#38bdf8" font-size="18" font-weight="600" letter-spacing="0.2" class="title">Full-Stack &amp; Systems Engineer</text>
  </g>

  <!-- Executive Summary -->
  <g transform="translate(42, 120)">
    <text x="0" y="0" fill="#94a3b8" font-size="13.5" font-weight="400" letter-spacing="0.1" class="title">
      Engineering serverless developer tooling, Model Context Protocol (MCP) systems, and financial infrastructure.
    </text>
  </g>

  <!-- Bottom Core Competencies Ribbon -->
  <g transform="translate(42, 150)">
    <text x="0" y="0" fill="#64748b" font-size="11.5" class="mono">
      <tspan fill="#e2e8f0">TypeScript</tspan> • 
      <tspan fill="#e2e8f0">Python</tspan> • 
      <tspan fill="#e2e8f0">Model Context Protocol</tspan> • 
      <tspan fill="#e2e8f0">Next.js</tspan> • 
      <tspan fill="#e2e8f0">Cloudflare Workers</tspan> • 
      <tspan fill="#e2e8f0">Fintech Rails</tspan>
    </text>
  </g>
</svg>
